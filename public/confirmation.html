<!DOCTYPE html>
<html>
<body style="font-family: 'Inter', Arial, sans-serif; background-color: #FAF8F3; padding: 40px 20px; text-align: center; margin: 0;">
  <div style="max-width: 500px; margin: 0 auto; background: #FFFFFF; padding: 40px 30px; border-radius: 12px; border: 1px solid #E7E2D8; box-shadow: 0 4px 12px rgba(24, 77, 71, 0.05);">
    <img src="https://kuanli.prathamgoel.com/kuanli_logo.png" alt="Kuanli CRM" style="height: 48px; margin-bottom: 30px;" onerror="this.style.display='none'">
    <h2 style="color: #1F2423; margin-bottom: 16px; font-size: 24px;">Welcome to Kuanli CRM</h2>
    <p style="color: #5F6967; font-size: 16px; margin-bottom: 32px; line-height: 1.6;">
      You have been invited to join the platform. Please verify your email to securely log in.
    </p>
    <a href="{{ .ConfirmationURL }}" style="background-color: #184D47; color: #FFFFFF; padding: 14px 28px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; display: inline-block;">
      Verify Email & Login
    </a>
  </div>
</body>
</html>
